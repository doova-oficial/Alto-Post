# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Configuração recomendada: serviço web SEMPRE LIGADO (plano pago "starter") + PostgreSQL pago.
#
# Por que não o plano gratuito?
#  * serviços web gratuitos hibernam após 15 min sem tráfego: o agendador interno para
#    e as publicações agendadas não saem no horário;
#  * o sistema de arquivos é perdido a cada hibernação/reinício (SQLite seria apagado);
#  * o PostgreSQL gratuito expira 30 dias após a criação.
# Alternativa de baixo custo descrita em docs/DEPLOY_RENDER.md (serviço gratuito + cron).
#
# Confira os nomes de planos vigentes no painel do Render antes de aplicar.
services:
  - type: web
    name: doova-marketing
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doova-db
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false            # gere com: python -m app.cli gen-key
      - key: PUBLIC_BASE_URL
        sync: false            # ex.: https://doova-marketing.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: META_LOGIN_TYPE
        value: unified
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: META_IG_USER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_PRIVACY_LEVEL
        value: SELF_ONLY
      - key: DRY_RUN
        value: "false"
      - key: REQUIRE_MANUAL_APPROVAL
        value: "false"
      - key: AUTO_SCHEDULE
        value: "true"
      - key: POSTING_STRATEGY
        value: fixed
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: MAX_POSTS_PER_DAY
        value: "10"
      - key: MIN_MINUTES_BETWEEN_POSTS
        value: "90"
      - key: POSTING_SLOTS
        value: 08:00,09:30,11:00,12:30,14:00,15:30,17:00,18:30,20:00,21:30
      - key: ANALYSIS_TARGET_AGE_HOURS
        value: "168"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: DOCS_ENABLED
        value: "true"
      - key: PIXABAY_API_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: pexels
      - key: VIDEO_PIXABAY_FALLBACK_ENABLED
        value: "false"
      - key: VIDEO_SEGMENT_COUNT
        value: "2"
      - key: VIDEO_GENERATED_IMAGE_COUNT
        value: "1"
      - key: VIDEO_CREATIVE_VARIANT
        value: auto
      - key: VIDEO_WIDTH
        value: "1080"
      - key: VIDEO_HEIGHT
        value: "1920"
      - key: VIDEO_FONT_SIZE
        value: "64"
      - key: VIDEO_MAX_DOWNLOAD_BYTES
        value: "12582912"
      - key: VIDEO_TTS_PROVIDER
        value: elevenlabs
      - key: VIDEO_RENDER_MODE
        value: android
      - key: VIDEO_WORKER_TOKEN
        sync: false
      - key: VIDEO_AUTO_PUBLISH
        value: "true"
      - key: ELEVENLABS_MODEL
        value: eleven_v4
      - key: PEXELS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TREND_AUTO_ENABLED
        value: "true"
      - key: TREND_AUTO_MAX_PER_DAY
        value: "10"
      - key: TREND_AUTO_INTERVAL_HOURS
        value: "1"

databases:
  - name: doova-db
    plan: basic-256mb
    databaseName: doova
    user: doova
